<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms</title>
</head>

<body>
  <h1>User Age and Birth using Forms</h1>
  <form action="">
    <label for="age">Age :- </label>
    <input type="number" min="0" max="100">
    <br><br>
    <label for="date">Date : -</label>
    <input type="date">
    <br><br>
    <input type="Submit">
    <br><br>
    <input type="Reset">
  </form>
</body>

</html>
