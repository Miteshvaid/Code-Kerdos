<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table-2</title>
</head>

<body>
  <h1>Table - 2</h1>
  <table border="2" cellpadding="2">
    <tr>
      <th>Product</th>
      <th>Region</th>
      <th>Sales</th>
    </tr>
    <tr>
      <td>Apples</td>
      <td>North</td>
      <td>$1000</td>
    </tr>
    <tr>
      <td>Oranges</td>
      <td>South</td>
      <td>$800</td>
    </tr>
    <tr>
      <td>Bananas</td>
      <td>East</td>
      <td>$1200</td>
    </tr>
    <tr>

      <td colspan="2"><b>Total</b> </td>

      <td> <b>$3000</b></td>
    </tr>
  </table>
</body>

</html>
