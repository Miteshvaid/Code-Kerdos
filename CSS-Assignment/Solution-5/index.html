<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User card flip animation</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <div class="card">


    <!-- Card-front -->
    <div class="card-inner">
      <div class="card-front">
        <img src="./images.jpeg" alt="img">
        <h4>Mitesh Vaid</h4>
        <p>MERN STACK DEVELOPER</p>
      </div>

      <!-- Card-back -->
      <div class="card-back">
        <h4>About Me</h4>
        <p>
          I’m a curious and creative problem-solver who loves building, learning, and exploring new ideas.</p>
      </div>
    </div>

  </div>
</body>

</html>
